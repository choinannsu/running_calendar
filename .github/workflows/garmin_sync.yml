name: Auto Sync Garmin Running Data

on:
  schedule:
    # Run every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-garmin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Garmin Running Data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python sync_garmin.py

      - name: Commit & Push to GitHub Repository
        run: |
          git config --global user.name "GitHub Actions AutoSync"
          git config --global user.email "actions@github.com"
          git add garmin_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Garmin mileage data [skip ci]" && git push origin main)

      - name: Deploy garmin_data.json to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: '35.252.164.151'
          username: 'ggcns722'
          key: ${{ secrets.GCP_SSH_KEY }}
          source: 'garmin_data.json'
          target: '/tmp/'

      - name: Update Web Server Data on GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '35.252.164.151'
          username: 'ggcns722'
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            sudo mv /tmp/garmin_data.json /var/www/html/garmin_data.json
            sudo chmod 644 /var/www/html/garmin_data.json
